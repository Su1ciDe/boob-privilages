<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Countdown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #0b0820;
            --bg-2: #1a0f3d;
            --accent-1: #ff5ea8;
            --accent-2: #7c5cff;
            --accent-3: #38d9f5;
            --text: #f4f1ff;
            --muted: rgba(244, 241, 255, 0.6);
            --card: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
            color: var(--text);
            background: radial-gradient(ellipse at top, var(--bg-2), var(--bg-1) 70%);
            background-color: var(--bg-1);
            overflow-x: hidden;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        /* Animated floating blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.55;
            z-index: 0;
            pointer-events: none;
            animation: float 18s ease-in-out infinite alternate;
        }
        .blob.b1 { width: 45vmax; height: 45vmax; background: var(--accent-2); top: -15vmax; left: -10vmax; }
        .blob.b2 { width: 35vmax; height: 35vmax; background: var(--accent-1); bottom: -12vmax; right: -8vmax; animation-duration: 22s; animation-delay: -6s; }
        .blob.b3 { width: 25vmax; height: 25vmax; background: var(--accent-3); top: 40%; left: 55%; opacity: 0.35; animation-duration: 26s; animation-delay: -12s; }

        @keyframes float {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(6vw, 4vh) scale(1.1); }
            100% { transform: translate(-4vw, -6vh) scale(0.95); }
        }

        /* Twinkling stars */
        #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .star {
            position: absolute;
            width: 2px; height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.15; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        main {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 960px;
            text-align: center;
            animation: rise 1s cubic-bezier(.2,.8,.2,1) both;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .eyebrow {
            display: inline-block;
            font-size: clamp(0.7rem, 2.4vw, 0.85rem);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 8px 16px;
            border: 1px solid var(--card-border);
            border-radius: 999px;
            background: var(--card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        h1 {
            margin: 20px 0 8px;
            font-size: clamp(2rem, 8vw, 4.5rem);
            font-weight: 700;
            line-height: 1.05;
            background: linear-gradient(90deg, var(--accent-3), var(--accent-2), var(--accent-1), var(--accent-3));
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 8s linear infinite;
        }
        @keyframes shimmer {
            to { background-position: 300% 0; }
        }

        .date {
            color: var(--muted);
            font-size: clamp(0.95rem, 3vw, 1.15rem);
            margin-bottom: clamp(28px, 6vw, 48px);
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: clamp(10px, 2.5vw, 24px);
        }

        .unit {
            position: relative;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: clamp(14px, 3vw, 24px);
            padding: clamp(16px, 4vw, 32px) 8px clamp(12px, 3vw, 22px);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255,255,255,0.08);
            overflow: hidden;
            animation: pop 0.8s cubic-bezier(.2,.8,.2,1) both;
        }
        .unit:nth-child(1) { animation-delay: 0.15s; }
        .unit:nth-child(2) { animation-delay: 0.25s; }
        .unit:nth-child(3) { animation-delay: 0.35s; }
        .unit:nth-child(4) { animation-delay: 0.45s; }
        @keyframes pop {
            from { opacity: 0; transform: scale(0.85) translateY(20px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Glow line on top of each card */
        .unit::before {
            content: "";
            position: absolute;
            top: 0; left: 15%; right: 15%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-1), var(--accent-3), transparent);
            opacity: 0.8;
        }

        .digits {
            display: flex;
            justify-content: center;
            font-size: clamp(2rem, 9vw, 5rem);
            font-weight: 700;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        /* Each digit is a rolling column */
        .digit {
            position: relative;
            display: inline-block;
            width: 0.62em;
            height: 1em;
            overflow: hidden;
        }
        .digit span {
            position: absolute;
            left: 0; right: 0;
            text-align: center;
            transition: transform 0.55s cubic-bezier(.65,0,.35,1), opacity 0.55s;
        }
        .digit .cur  { transform: translateY(0);    opacity: 1; }
        .digit .next { transform: translateY(-100%); opacity: 0; }
        .digit.roll .cur  { transform: translateY(100%); opacity: 0; }
        .digit.roll .next { transform: translateY(0);    opacity: 1; }

        .label {
            margin-top: clamp(8px, 2vw, 14px);
            font-size: clamp(0.6rem, 2.2vw, 0.85rem);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* Seconds card pulses */
        .unit.seconds { animation: pop 0.8s 0.45s cubic-bezier(.2,.8,.2,1) both, pulse 1s 1.3s ease-in-out infinite; }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 40px rgba(0,0,0,0.35), 0 0 0 0 rgba(255, 94, 168, 0); }
            50%      { box-shadow: 0 10px 40px rgba(0,0,0,0.35), 0 0 30px 0 rgba(255, 94, 168, 0.25); }
        }

        .progress {
            margin: clamp(28px, 6vw, 44px) auto 0;
            max-width: 560px;
        }
        .bar {
            height: 8px;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 999px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 0;
            /* Gradient starts and ends on the same colour so the tiles join seamlessly */
            background: linear-gradient(90deg, var(--accent-3), var(--accent-2), var(--accent-1), var(--accent-2), var(--accent-3));
            background-size: 200% 100%;
            background-repeat: repeat-x;
            border-radius: inherit;
            transition: width 1s ease;
            animation: bar-flow 4s linear infinite;
        }
        /* With a 200%-wide background, 200% position = exactly one tile, so the loop has no jump */
        @keyframes bar-flow {
            from { background-position: 0% 0; }
            to   { background-position: 200% 0; }
        }
        .progress-text {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--muted);
        }

        /* Finished state */
        .done-message {
            display: none;
            font-size: clamp(1.6rem, 6vw, 3rem);
            font-weight: 700;
            animation: rise 1s both;
        }
        body.finished .countdown,
        body.finished .progress { display: none; }
        body.finished .done-message { display: block; }

        /* Confetti */
        .confetti {
            position: fixed;
            top: -10px;
            width: 10px; height: 14px;
            z-index: 2;
            pointer-events: none;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); }
        }

        /* Joke of the day */
        .joke {
            position: relative;
            margin: clamp(28px, 6vw, 44px) auto 0;
            max-width: 640px;
            padding: clamp(20px, 4vw, 30px) clamp(18px, 4vw, 32px);
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: clamp(14px, 3vw, 22px);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
            animation: pop 0.8s 0.6s cubic-bezier(.2,.8,.2,1) both;
        }
        .joke-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: clamp(0.65rem, 2.2vw, 0.78rem);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--accent-1);
            margin-bottom: 12px;
        }
        .joke-label .emoji {
            display: inline-block;
            animation: wobble 2.4s ease-in-out infinite;
        }
        @keyframes wobble {
            0%, 100% { transform: rotate(0); }
            25% { transform: rotate(-12deg); }
            75% { transform: rotate(12deg); }
        }
        .joke-text {
            font-size: clamp(1.05rem, 3.6vw, 1.35rem);
            line-height: 1.45;
            font-weight: 600;
            animation: rise 0.8s 0.9s both;
        }
        .joke-text.swap { animation: rise 0.8s both; }
        .joke-meta {
            margin-top: 12px;
            font-size: 0.8rem;
            color: var(--muted);
        }

        /* Mobile: 2x2 grid */
        @media (max-width: 560px) {
            .countdown { grid-template-columns: repeat(2, 1fr); }
            .digits { font-size: clamp(2.6rem, 16vw, 4rem); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>

            function updateJoke() {
                var day = dayIndex();
                if (day === shownDay) return;
                var idx = ((day % jokes.length) + jokes.length) % jokes.length;
                jokeEl.textContent = jokes[idx];
                jokeMeta.textContent = "Day " + (day + 1);
                if (shownDay !== null) {
                    jokeEl.classList.remove("swap");
                    void jokeEl.offsetWidth;
                    jokeEl.classList.add("swap");
                }
                shownDay = day;
            }

            var baseTick = tick;
            tick = function () { baseTick(); updateJoke(); };

            tick();
            // Align ticks to the start of each second
            setTimeout(function () {
                tick();
                setInterval(tick, 1000);
            }, 1000 - (Date.now() % 1000));
        })();
    </script>
</body>
</html>
