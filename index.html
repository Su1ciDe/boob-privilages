<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Countdown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #0b0820;
            --bg-2: #1a0f3d;
            --accent-1: #ff5ea8;
            --accent-2: #7c5cff;
            --accent-3: #38d9f5;
            --text: #f4f1ff;
            --muted: rgba(244, 241, 255, 0.6);
            --card: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
            color: var(--text);
            background: radial-gradient(ellipse at top, var(--bg-2), var(--bg-1) 70%);
            background-color: var(--bg-1);
            overflow-x: hidden;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        /* Animated floating blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.55;
            z-index: 0;
            pointer-events: none;
            animation: float 18s ease-in-out infinite alternate;
        }
        .blob.b1 { width: 45vmax; height: 45vmax; background: var(--accent-2); top: -15vmax; left: -10vmax; }
        .blob.b2 { width: 35vmax; height: 35vmax; background: var(--accent-1); bottom: -12vmax; right: -8vmax; animation-duration: 22s; animation-delay: -6s; }
        .blob.b3 { width: 25vmax; height: 25vmax; background: var(--accent-3); top: 40%; left: 55%; opacity: 0.35; animation-duration: 26s; animation-delay: -12s; }

        @keyframes float {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(6vw, 4vh) scale(1.1); }
            100% { transform: translate(-4vw, -6vh) scale(0.95); }
        }

        /* Twinkling stars */
        #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .star {
            position: absolute;
            width: 2px; height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.15; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        main {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 960px;
            text-align: center;
            animation: rise 1s cubic-bezier(.2,.8,.2,1) both;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .eyebrow {
            display: inline-block;
            font-size: clamp(0.7rem, 2.4vw, 0.85rem);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 8px 16px;
            border: 1px solid var(--card-border);
            border-radius: 999px;
            background: var(--card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        h1 {
            margin: 20px 0 8px;
            font-size: clamp(2rem, 8vw, 4.5rem);
            font-weight: 700;
            line-height: 1.05;
            background: linear-gradient(90deg, var(--accent-3), var(--accent-2), var(--accent-1), var(--accent-3));
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 8s linear infinite;
        }
        @keyframes shimmer {
            to { background-position: 300% 0; }
        }

        .date {
            color: var(--muted);
            font-size: clamp(0.95rem, 3vw, 1.15rem);
            margin-bottom: clamp(28px, 6vw, 48px);
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: clamp(10px, 2.5vw, 24px);
        }

        .unit {
            position: relative;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: clamp(14px, 3vw, 24px);
            padding: clamp(16px, 4vw, 32px) 8px clamp(12px, 3vw, 22px);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255,255,255,0.08);
            overflow: hidden;
            animation: pop 0.8s cubic-bezier(.2,.8,.2,1) both;
        }
        .unit:nth-child(1) { animation-delay: 0.15s; }
        .unit:nth-child(2) { animation-delay: 0.25s; }
        .unit:nth-child(3) { animation-delay: 0.35s; }
        .unit:nth-child(4) { animation-delay: 0.45s; }
        @keyframes pop {
            from { opacity: 0; transform: scale(0.85) translateY(20px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Glow line on top of each card */
        .unit::before {
            content: "";
            position: absolute;
            top: 0; left: 15%; right: 15%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-1), var(--accent-3), transparent);
            opacity: 0.8;
        }

        .digits {
            display: flex;
            justify-content: center;
            font-size: clamp(2rem, 9vw, 5rem);
            font-weight: 700;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        /* Each digit is a rolling column */
        .digit {
            position: relative;
            display: inline-block;
            width: 0.62em;
            height: 1em;
            overflow: hidden;
        }
        .digit span {
            position: absolute;
            left: 0; right: 0;
            text-align: center;
            transition: transform 0.55s cubic-bezier(.65,0,.35,1), opacity 0.55s;
        }
        .digit .cur  { transform: translateY(0);    opacity: 1; }
        .digit .next { transform: translateY(-100%); opacity: 0; }
        .digit.roll .cur  { transform: translateY(100%); opacity: 0; }
        .digit.roll .next { transform: translateY(0);    opacity: 1; }

        .label {
            margin-top: clamp(8px, 2vw, 14px);
            font-size: clamp(0.6rem, 2.2vw, 0.85rem);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* Seconds card pulses */
        .unit.seconds { animation: pop 0.8s 0.45s cubic-bezier(.2,.8,.2,1) both, pulse 1s 1.3s ease-in-out infinite; }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 40px rgba(0,0,0,0.35), 0 0 0 0 rgba(255, 94, 168, 0); }
            50%      { box-shadow: 0 10px 40px rgba(0,0,0,0.35), 0 0 30px 0 rgba(255, 94, 168, 0.25); }
        }

        .progress {
            margin: clamp(28px, 6vw, 44px) auto 0;
            max-width: 560px;
        }
        .bar {
            height: 8px;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 999px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--accent-3), var(--accent-2), var(--accent-1));
            background-size: 200% 100%;
            border-radius: inherit;
            transition: width 1s ease;
            animation: shimmer 4s linear infinite;
        }
        .progress-text {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--muted);
        }

        /* Finished state */
        .done-message {
            display: none;
            font-size: clamp(1.6rem, 6vw, 3rem);
            font-weight: 700;
            animation: rise 1s both;
        }
        body.finished .countdown,
        body.finished .progress { display: none; }
        body.finished .done-message { display: block; }

        /* Confetti */
        .confetti {
            position: fixed;
            top: -10px;
            width: 10px; height: 14px;
            z-index: 2;
            pointer-events: none;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); }
        }

        /* Mobile: 2x2 grid */
        @media (max-width: 560px) {
            .countdown { grid-template-columns: repeat(2, 1fr); }
            .digits { font-size: clamp(2.6rem, 16vw, 4rem); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div id="stars"></div>

    <main>
        <span class="eyebrow">Counting down</span>
        <h1>Almost there</h1>
        <p class="date" id="target-date"></p>

        <section class="countdown" aria-live="polite">
            <div class="unit"><div class="digits" data-unit="days"></div><div class="label">Days</div></div>
            <div class="unit"><div class="digits" data-unit="hours"></div><div class="label">Hours</div></div>
            <div class="unit"><div class="digits" data-unit="minutes"></div><div class="label">Minutes</div></div>
            <div class="unit seconds"><div class="digits" data-unit="seconds"></div><div class="label">Seconds</div></div>
        </section>

        <div class="progress">
            <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
            <p class="progress-text" id="progress-text"></p>
        </div>

        <p class="done-message">🎉 The day is here! 🎉</p>
    </main>

    <script>
        (function () {
            // 19 October 2026 + 3 months = 19 January 2027 (local midnight)
            var start = new Date(2026, 9, 19, 0, 0, 0);
            var target = new Date(start);
            target.setMonth(target.getMonth() + 3);

            document.getElementById("target-date").textContent = target.toLocaleDateString(undefined, {
                weekday: "long", year: "numeric", month: "long", day: "numeric"
            });

            // Stars
            var stars = document.getElementById("stars");
            var count = window.innerWidth < 600 ? 40 : 90;
            for (var i = 0; i < count; i++) {
                var s = document.createElement("div");
                s.className = "star";
                s.style.left = Math.random() * 100 + "%";
                s.style.top = Math.random() * 100 + "%";
                s.style.animationDelay = (Math.random() * 3) + "s";
                s.style.animationDuration = (2 + Math.random() * 3) + "s";
                stars.appendChild(s);
            }

            var groups = {};
            document.querySelectorAll(".digits").forEach(function (el) {
                groups[el.dataset.unit] = { el: el, value: null };
            });

            function buildDigit(ch) {
                var d = document.createElement("span");
                d.className = "digit";
                d.innerHTML = '<span class="cur"></span><span class="next"></span>';
                d.firstChild.textContent = ch;
                return d;
            }

            function setValue(unit, str) {
                var g = groups[unit];
                if (g.value === str) return;
                var el = g.el;

                // Rebuild if the number of digits changed
                if (!g.value || g.value.length !== str.length) {
                    el.innerHTML = "";
                    for (var i = 0; i < str.length; i++) el.appendChild(buildDigit(str[i]));
                    g.value = str;
                    return;
                }

                for (var j = 0; j < str.length; j++) {
                    if (g.value[j] === str[j]) continue;
                    (function (digit, ch) {
                        var cur = digit.querySelector(".cur");
                        var next = digit.querySelector(".next");
                        next.textContent = ch;
                        digit.classList.add("roll");
                        setTimeout(function () {
                            cur.textContent = ch;
                            digit.classList.remove("roll");
                            // Reset without animating back
                            cur.style.transition = next.style.transition = "none";
                            void digit.offsetWidth;
                            cur.style.transition = next.style.transition = "";
                        }, 560);
                    })(el.children[j], str[j]);
                }
                g.value = str;
            }

            function pad(n) { return n < 10 ? "0" + n : String(n); }

            var finished = false;

            function tick() {
                var now = Date.now();
                var diff = Math.max(0, target - now);

                var days = Math.floor(diff / 86400000);
                var hours = Math.floor(diff / 3600000) % 24;
                var minutes = Math.floor(diff / 60000) % 60;
                var seconds = Math.floor(diff / 1000) % 60;

                setValue("days", pad(days));
                setValue("hours", pad(hours));
                setValue("minutes", pad(minutes));
                setValue("seconds", pad(seconds));

                var total = target - start;
                var pct = Math.min(100, Math.max(0, ((now - start) / total) * 100));
                document.getElementById("bar-fill").style.width = pct.toFixed(2) + "%";
                document.getElementById("progress-text").textContent = pct.toFixed(1) + "% of the way there";

                if (diff === 0 && !finished) {
                    finished = true;
                    document.body.classList.add("finished");
                    confetti();
                }
            }

            function confetti() {
                var colors = ["#ff5ea8", "#7c5cff", "#38d9f5", "#ffd84d", "#ffffff"];
                for (var i = 0; i < 150; i++) {
                    var c = document.createElement("div");
                    c.className = "confetti";
                    c.style.left = Math.random() * 100 + "vw";
                    c.style.background = colors[i % colors.length];
                    c.style.animationDuration = (2.5 + Math.random() * 3) + "s";
                    c.style.animationDelay = (Math.random() * 2) + "s";
                    c.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
                    document.body.appendChild(c);
                }
            }

            tick();
            // Align ticks to the start of each second
            setTimeout(function () {
                tick();
                setInterval(tick, 1000);
            }, 1000 - (Date.now() % 1000));
        })();
    </script>
</body>
</html>
